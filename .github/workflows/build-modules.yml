name: build-modules

# 1. Finds Unraid releases (>= MIN_UNRAID) in https://releases.unraid.net/json that are not yet in
#    configs/unraid-versions.txt, extracts each one's kernel .config and commits it to configs/.
# 2. Builds uas_arb.ko for every configs/<kernel>.config that has no module yet (or all, if src
#    whose .src source-hash sidecar is missing/stale, or all on request) from that kernel's own uas.c + patches/uas-arbiter.patch, and
#    publishes uas_arb-<kernel>.ko + .sha256 to the "modules" release, where the plugin downloads it.
on:
  push:
    branches: [main]
    paths: ['configs/**', 'patches/**', 'tools/build-for-unraid.sh', 'tools/unraid-kernel-config.sh', '.github/workflows/build-modules.yml']
  schedule:
    - cron: '23 5 * * 1'   # weekly: pick up new Unraid releases
  workflow_dispatch:
    inputs:
      versions:
        description: 'Unraid versions to add (space-separated). Empty = all new releases >= MIN_UNRAID'
        type: string
        default: ''
      rebuild:
        description: 'Rebuild modules that already exist'
        type: boolean
        default: false

permissions:
  contents: write

env:
  MIN_UNRAID: '7.0.0'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential flex bison libelf-dev libssl-dev bc xz-utils squashfs-tools unzip

      - name: Add kernel configs for new Unraid releases
        env:
          VERSIONS: ${{ inputs.versions }}
        run: |
          set -euo pipefail
          touch configs/unraid-versions.txt
          if [ -z "${VERSIONS:-}" ]; then
            VERSIONS=$(curl -fsSL https://releases.unraid.net/json | python3 -c "
          import json,sys,os
          def k(v): return tuple(int(x) for x in v.split('.') if x.isdigit())
          m=k(os.environ['MIN_UNRAID'])
          print(' '.join(r['version'] for r in json.load(sys.stdin) if r.get('url') and k(r['version'])>=m))")
          fi
          added=""
          for v in $VERSIONS; do
            grep -q "^$v " configs/unraid-versions.txt && continue
            echo "== Unraid $v: extracting kernel config"
            if kr=$(tools/unraid-kernel-config.sh "$v" configs); then
              echo "$v $kr" >> configs/unraid-versions.txt; added="$added $v"
              echo "   -> $kr"
            else
              echo "::warning::could not extract the kernel config of Unraid $v"
            fi
          done
          sort -t. -k1,1n -k2,2n -k3,3n -u -o configs/unraid-versions.txt configs/unraid-versions.txt
          if [ -n "$added" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add configs
            git commit -m "configs: add kernel configs for Unraid$added"
            git push
          fi

      - name: Ensure "modules" release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view modules >/dev/null 2>&1 || gh release create modules \
            --title "Prebuilt uas_arb modules" \
            --notes "One uas_arb-KERNEL.ko (+ .sha256) per Unraid kernel (KERNEL = uname -r), built by the build-modules workflow. The Unraid plugin downloads the one matching \`uname -r\`."

      - name: Build and upload modules
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -uo pipefail
          # every module carries uas_arb-KERNEL.ko.src = hash of the sources it was built from;
          # (re)build when that is missing or differs from the current sources
          SRC=$(cat patches/uas-arbiter.patch tools/build-for-unraid.sh | sha256sum | cut -c1-16)
          echo "source hash: $SRC"
          base="https://github.com/${{ github.repository }}/releases/download/modules"
          mkdir -p dist; failed=""
          for cfg in configs/*.config; do
            kr=$(basename "$cfg" .config); asset="uas_arb-$kr.ko"
            have=$(curl -fsSL "$base/$asset.src" 2>/dev/null || true)
            if [ "$have" = "$SRC" ] && [ "${REBUILD:-false}" != true ]; then
              echo "== $kr: up to date ($SRC)"; continue
            fi
            echo "== building $kr"
            if WORK="$RUNNER_TEMP/build-$kr" tools/build-for-unraid.sh "$cfg"; then
              ko="$RUNNER_TEMP/build-$kr/mod/uas_arb.ko"
              if [ -f "$ko" ] && [ "$(modinfo -F vermagic "$ko" | cut -d' ' -f1)" = "$kr" ]; then
                cp "$ko" "dist/$asset"; (cd dist && sha256sum "$asset" > "$asset.sha256"); echo "$SRC" > "dist/$asset.src"
              else failed="$failed $kr"; fi
            else failed="$failed $kr"; fi
            rm -rf "$RUNNER_TEMP/build-$kr"
          done
          if ls dist/*.ko >/dev/null 2>&1; then gh release upload modules dist/* --clobber; ls -la dist; fi
          if [ -n "$failed" ]; then echo "::error::build failed for:$failed (patch may need porting)"; exit 1; fi
